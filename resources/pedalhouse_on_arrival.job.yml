# Lakeflow Job with a FILE ARRIVAL trigger: refresh the pipeline as soon as
# a city drops new trip files, instead of waiting for the daily schedule.
# Ideal when data arrives at unpredictable times. Paused by default:
# unpause it in the UI (or set pause_status: UNPAUSED) for lab 05.

resources:
  jobs:
    pedalhouse_on_arrival:
      name: pedalhouse-on-file-arrival
      description: Refresh the pipeline whenever new trip files land in the landing volume.
      max_concurrent_runs: 1
      tags:
        project: pedalhouse
      trigger:
        pause_status: PAUSED
        file_arrival:
          url: /Volumes/${var.catalog}/${var.schema}/landing/trips/
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: refresh_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.pedalhouse_pipeline.id}
